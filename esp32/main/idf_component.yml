dependencies:
  idf: ">=6.1"
  # cJSON and the MQTT client live in the component registry since ESP-IDF 6.0.
  espressif/cjson: "*"
  espressif/mqtt: "*"
  espressif/mdns: "*"
  joltwallet/littlefs: "*"
  # Sensor drivers (DHT11/DHT22 and BMP280/BME280); only the configured one is linked.
  esp-idf-lib/dht: "*"
  esp-idf-lib/bmp280: "*"

# Addresses derived from the root .env (shared by every service), passed to
# backend and mqtt-runtime with the names Settings expects. Each default
# references the same variable first, so a value in backend/.env still wins.
x-shared-network-env: &shared-network-env
  BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT is required (set it in the root .env)}
  BACKEND_HOST_URL: ${BACKEND_HOST_URL:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}}
  VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}}
  VITE_FRONTEND_PORT: ${VITE_FRONTEND_PORT:-${FRONTEND_PORT:?FRONTEND_PORT is required (set it in the root .env)}}
  LANDING_URL: ${LANDING_URL:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:${LANDING_PORT:?LANDING_PORT is required (set it in the root .env)}}
  LAN_BIND_IP: ${LAN_BIND_IP:-}
  EMQX_API_KEY: ${EMQX_API_KEY:-}
  EMQX_API_SECRET: ${EMQX_API_SECRET:-}

services:
  backend:
    image: ceiot/backend:dev
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      # Optional S3 credentials (S3_ACCESS_KEY / S3_SECRET_KEY) shared with the
      # seaweedfs service. Absent means document storage is disabled (503).
      - path: ../seaweedfs/.env
        required: false
    environment:
      <<: *shared-network-env
      MQTT_CLIENT_ID: Backend-Admin
      # EMQX built-in-database user shared by backend + mqtt-runtime (see
      # mqtt/acl.conf); the password is sourced from mqtt/.env so both the
      # broker bootstrap and these clients always agree on one value.
      EMQX_USER: backend-services
      EMQX_PASSWORD: ${EMQX_BACKEND_PASSWORD:?EMQX_BACKEND_PASSWORD is required (set it in mqtt/.env)}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      # Optional live layer (no password: internal network only). The app
      # keeps working without Redis; see app/core/redis.py.
      REDIS_URL: redis://redis:6379/0
      # Object storage (SeaweedFS S3, internal network only).
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_BUCKET: ceiot-documents
      # Local embeddings (optional profile `embeddings-local`); only used when
      # EMBEDDING_PROVIDER=local. Without the profile it is simply unreachable.
      EMBEDDING_LOCAL_URL: http://embeddings:80
      # The application logs in as DB_USER (no SUPERUSER/BYPASSRLS: RLS
      # applies); Alembic as the cluster superuser ALEMBIC_DB_USER. DB_APP_ROLE
      # tells migration 0029 which role receives the application grants.
      DATABASE_URL: "postgresql+psycopg://${DB_USER:?}:${DB_PASSWORD:?}\
        @postgresql:5432/${DB_DATABASE:?}"
      ALEMBIC_DATABASE_URL: "postgresql+psycopg://${ALEMBIC_DB_USER:?ALEMBIC_DB_USER is required (set it in timescaledb/.env)}:\
        ${ALEMBIC_DB_PASSWORD:?ALEMBIC_DB_PASSWORD is required (set it in timescaledb/.env)}@postgresql:5432/${DB_DATABASE:?}"
      DB_APP_ROLE: ${DB_USER:?}
    ports:
      # Always on loopback (frontend and tools on localhost). LAN_BIND_IP (root
      # .env) adds the same port on the LAN IP so real devices can download
      # firmware images; unset, that second binding falls back to the unused
      # loopback 127.0.0.2. Applies to this port and the MQTT mTLS port only.
      - 127.0.0.1:${BACKEND_PORT:?BACKEND_PORT is required (set it in the root .env)}:8000
      - ${LAN_BIND_IP:-127.0.0.2}:${BACKEND_PORT:?BACKEND_PORT is required (set it in the root .env)}:8000
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-network
    restart: always

  # Consumes device MQTT topics (telemetry, events, status) and writes them.
  # Kept apart from the API, which is publisher-only by design.
  mqtt-runtime:
    image: ceiot/mqtt-runtime:dev
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main_runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
      # Optional S3 credentials (S3_ACCESS_KEY / S3_SECRET_KEY) shared with the
      # seaweedfs service. Absent means document storage is disabled (503).
      - path: ../seaweedfs/.env
        required: false
    environment:
      <<: *shared-network-env
      MQTT_CLIENT_ID: Backend-Runtime
      EMQX_USER: backend-services
      EMQX_PASSWORD: ${EMQX_BACKEND_PASSWORD:?EMQX_BACKEND_PASSWORD is required (set it in mqtt/.env)}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      # Optional live layer (no password: internal network only). The app
      # keeps working without Redis; see app/core/redis.py.
      REDIS_URL: redis://redis:6379/0
      # Object storage (SeaweedFS S3, internal network only).
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_BUCKET: ceiot-documents
      # Local embeddings (optional profile `embeddings-local`); only used when
      # EMBEDDING_PROVIDER=local. Without the profile it is simply unreachable.
      EMBEDDING_LOCAL_URL: http://embeddings:80
      # The application logs in as DB_USER (no SUPERUSER/BYPASSRLS: RLS
      # applies); Alembic as the cluster superuser ALEMBIC_DB_USER. DB_APP_ROLE
      # tells migration 0029 which role receives the application grants.
      DATABASE_URL: "postgresql+psycopg://${DB_USER:?}:${DB_PASSWORD:?}\
        @postgresql:5432/${DB_DATABASE:?}"
      ALEMBIC_DATABASE_URL: "postgresql+psycopg://${ALEMBIC_DB_USER:?ALEMBIC_DB_USER is required (set it in timescaledb/.env)}:\
        ${ALEMBIC_DB_PASSWORD:?ALEMBIC_DB_PASSWORD is required (set it in timescaledb/.env)}@postgresql:5432/${DB_DATABASE:?}"
      DB_APP_ROLE: ${DB_USER:?}
    depends_on:
      postgresql:
        condition: service_healthy
      emqx:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-network
    restart: always

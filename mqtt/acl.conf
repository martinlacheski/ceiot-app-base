%% ACL del proyecto para EMQX (formato "rich rule", ver defaults de EMQX
%% para la sintaxis completa). Se evalúa en orden, la primera regla que
%% matchea decide; `authorization.no_match = deny` cierra cualquier caso no
%% cubierto.
%%
%% - `backend-services`: usuario compartido por los procesos `backend` y
%%   `mqtt-runtime` (autenticación por usuario/contraseña en el listener
%%   TCP interno). Acceso completo al árbol de tópicos del proyecto.
%% - Dispositivos: se conectan por TLS mutuo (listener SSL, sin
%%   usuario/contraseña); el username efectivo es el CN de su certificado
%%   cliente (ver `peer_cert_as_username = cn` en el listener SSL), que por
%%   convención es el serial del dispositivo. Solo pueden publicar/suscribir
%%   dentro de su propio árbol `iot/devices/<serial>/#`.
%% - Se deniega explícitamente cualquier suscripción a `$SYS/#` o al
%%   wildcard global `#`, y cualquier otra cosa no cubierta arriba.

{allow, {username, "backend-services"}, all, ["iot/#"]}.

{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

{allow, all, all, ["iot/devices/${username}/#"]}.

{deny, all}.
